server {
    listen 80;
    server_name localhost;

    # No mostrar la versión de Nginx en respuestas ni páginas de error
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint simple de verificación de salud (monitoreo)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
